services:
  jellyfin:
    container_name: jellyfin
    image: ghcr.io/hotio/jellyfin:latest
    ports:
      - "8096:8096"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      - WEBUI_PORTS=8096/tcp
    volumes:
      - ./config:/config
      - ../radarr/data/movies:/movies
      - ../sonarr/data/shows:/shows
    restart: unless-stopped
    networks:
      - media

networks:
  media:
    external: true
