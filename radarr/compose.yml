services:
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      - WEBUI_PORTS=7878/tcp
    volumes:
      - ./config:/config
      - ./data:/data
    restart: unless-stopped
    networks:
      - media
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  media:
    external: true
