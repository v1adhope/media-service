services:
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      - WEBUI_PORTS=8989/tcp
    volumes:
      - ./config:/config
      - ./data:/data
    restart: unless-stopped
    networks:
      - media
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  media:
    external: true
