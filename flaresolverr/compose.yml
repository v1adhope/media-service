services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
      - PORT=8191
      - PROXY_URL=http://host.docker.internal:20172
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - media
    restart: unless-stopped

networks:
  media:
    external: true
