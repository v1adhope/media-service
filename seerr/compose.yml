services:
  seerr:
    container_name: seerr
    image: ghcr.io/hotio/seerr:latest
    ports:
      - "5055:5055"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      - WEBUI_PORTS=5055/tcp
    volumes:
      - ./config:/config
    restart: unless-stopped
    networks:
      - media

networks:
  media:
    external: true
